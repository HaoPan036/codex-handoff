<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Codex Handoff conceptual flow</title>
  <desc id="desc">Repeated context compaction reaches a safe Stop boundary. Repository evidence is collected into CODEX_HANDOFF.md, which grounds a clean Codex session.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#162033" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="270" rx="24" fill="url(#background)"/>
  <text x="52" y="48" fill="#64748b" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">CONCEPTUAL FLOW</text>

  <g stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M247 148 H268 M260 140 L269 148 L260 156"/>
    <path d="M477 148 H498 M490 140 L499 148 L490 156"/>
    <path d="M707 148 H728 M720 140 L729 148 L720 156"/>
    <path d="M937 148 H958 M950 140 L959 148 L950 156"/>
  </g>

  <g filter="url(#shadow)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g>
      <rect x="45" y="88" width="202" height="120" rx="18" fill="#ffffff" stroke="#d6deea"/>
      <circle cx="77" cy="119" r="14" fill="#f97316"/>
      <text x="77" y="124" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">1</text>
      <text x="65" y="158" fill="#172033" font-size="18" font-weight="700">Repeated compaction</text>
      <text x="65" y="184" fill="#64748b" font-size="14">Context gets less reliable</text>
    </g>
    <g>
      <rect x="275" y="88" width="202" height="120" rx="18" fill="#ffffff" stroke="#d6deea"/>
      <circle cx="307" cy="119" r="14" fill="#0ea5e9"/>
      <text x="307" y="124" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">2</text>
      <text x="295" y="158" fill="#172033" font-size="18" font-weight="700">Safe Stop boundary</text>
      <text x="295" y="184" fill="#64748b" font-size="14">Active work finishes first</text>
    </g>
    <g>
      <rect x="505" y="88" width="202" height="120" rx="18" fill="#ffffff" stroke="#d6deea"/>
      <circle cx="537" cy="119" r="14" fill="#8b5cf6"/>
      <text x="537" y="124" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">3</text>
      <text x="525" y="158" fill="#172033" font-size="18" font-weight="700">Repository evidence</text>
      <text x="525" y="184" fill="#64748b" font-size="14">Git, files, tests, rules</text>
    </g>
    <g>
      <rect x="735" y="88" width="202" height="120" rx="18" fill="#172033" stroke="#172033"/>
      <circle cx="767" cy="119" r="14" fill="#22c55e"/>
      <text x="767" y="124" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">4</text>
      <text x="755" y="158" fill="#ffffff" font-size="17" font-weight="700">CODEX_HANDOFF.md</text>
      <text x="755" y="184" fill="#cbd5e1" font-size="14">Structured and validated</text>
    </g>
    <g>
      <rect x="965" y="88" width="190" height="120" rx="18" fill="#ffffff" stroke="#d6deea"/>
      <circle cx="997" cy="119" r="14" fill="#14b8a6"/>
      <text x="997" y="124" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">5</text>
      <text x="985" y="158" fill="#172033" font-size="18" font-weight="700">Clean session</text>
      <text x="985" y="184" fill="#64748b" font-size="14">Verify, then continue</text>
    </g>
  </g>
</svg>
